name: Auto-tag flowglad release

on:
  push:
    branches: [flowglad-main]
    paths:
      - "packages/just-bash/**"
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Explicit tag to cut (e.g. v2.14.3-fgp.5). Leave blank to auto-compute."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: flowglad-auto-tag
  cancel-in-progress: false

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip auto-tag]')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flowglad-main
          fetch-depth: 0
          lfs: true

      - name: Configure git identity
        run: |
          git config user.name "flowglad-release[bot]"
          git config user.email "flowglad-release@users.noreply.github.com"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - uses: oven-sh/setup-bun@v2

      - name: Compute next tag
        id: tag
        env:
          TAG_OVERRIDE: ${{ inputs.tag_override }}
        run: |
          set -euo pipefail
          if [ -n "${TAG_OVERRIDE:-}" ]; then
            echo "Using override tag: ${TAG_OVERRIDE}"
            echo "tag=${TAG_OVERRIDE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(node -p "require('./packages/just-bash/package.json').version")
          PREFIX="v${VERSION}-fgp."
          git fetch --tags origin
          MAX_N=$(git tag -l "${PREFIX}*" | sed "s|^${PREFIX}||" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "${MAX_N:-}" ]; then
            NEXT_N=1
          else
            NEXT_N=$((MAX_N + 1))
          fi
          TAG="${PREFIX}${NEXT_N}"
          echo "Computed next tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cut and push tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: pnpm flowglad:tag -- --tag "$TAG" --push

      - name: Bump just-bash dependency in flowglad/provisioning-agent
        env:
          PR_TOKEN: ${{ secrets.PROVISIONING_AGENT_PR_TOKEN }}
          NEW_TAG: ${{ steps.tag.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${PR_TOKEN:-}" ]; then
            echo "::warning::PROVISIONING_AGENT_PR_TOKEN secret not set; skipping consumer dependency PR for ${NEW_TAG}"
            exit 0
          fi

          WORK=$(mktemp -d)
          git clone --depth 1 \
            "https://x-access-token:${PR_TOKEN}@github.com/flowglad/provisioning-agent.git" \
            "$WORK"
          cd "$WORK"

          git config user.name "flowglad-release[bot]"
          git config user.email "flowglad-release@users.noreply.github.com"

          BRANCH="deps/just-bash-${NEW_TAG}"
          git checkout -b "$BRANCH"

          # Discover every package.json that pins github:flowglad/just-bash and
          # repin it. Discovery (rather than hardcoded paths) keeps this working
          # when the consumer's package layout changes — e.g. the dep moved from
          # packages/agent to packages/agent-domain, which silently no-op'd the
          # old hardcoded list. Skip node_modules.
          mapfile -t FILES < <(grep -rlE '"just-bash"[[:space:]]*:[[:space:]]*"github:flowglad/just-bash#' \
            --include=package.json --exclude-dir=node_modules . || true)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::warning::No package.json pins github:flowglad/just-bash in provisioning-agent; nothing to repin for ${NEW_TAG}. Has the dependency been removed or renamed?"
            exit 0
          fi

          echo "Repinning just-bash in: ${FILES[*]}"
          # Targeted replacement; preserves the rest of each file's formatting.
          for f in "${FILES[@]}"; do
            sed -i "s|\"just-bash\": \"github:flowglad/just-bash#[^\"]*\"|\"just-bash\": \"github:flowglad/just-bash#${NEW_TAG}\"|g" "$f"
          done

          if git diff --quiet; then
            echo "just-bash already pinned to ${NEW_TAG} in provisioning-agent; nothing to PR"
            exit 0
          fi

          # Best-effort bun.lock update. Tolerate failure (e.g. private registry
          # auth) — the consumer's CI will refuse a stale lock and can be
          # regenerated by hand on the PR.
          bun install || echo "::warning::bun install failed in provisioning-agent; consumer must regenerate bun.lock"

          git add -A
          git commit -m "deps: bump just-bash to ${NEW_TAG}"
          git push origin "$BRANCH"

          PR_BODY=$(printf 'Auto-generated by flowglad/just-bash auto-tag workflow.\n\n- Tag: https://github.com/flowglad/just-bash/tree/%s\n- Source commit: https://github.com/flowglad/just-bash/commit/%s\n' \
            "$NEW_TAG" "$SOURCE_SHA")

          GH_TOKEN="$PR_TOKEN" gh pr create \
            --repo flowglad/provisioning-agent \
            --base main \
            --head "$BRANCH" \
            --title "deps: bump just-bash to ${NEW_TAG}" \
            --body "$PR_BODY"

      - name: Summarize
        if: always()
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TRIGGER: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Auto-tag run"
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Trigger: ${TRIGGER}"
            echo "- Source commit: ${SOURCE_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
